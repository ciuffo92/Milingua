<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1022"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Headphones Gradient -->
    <linearGradient id="headsetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Waveform Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base App Icon Rounded Square Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="113" fill="none" stroke="#6366f1" stroke-opacity="0.3" stroke-width="3"/>

  <!-- Subtle ambient glow circle in the center -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>

  <!-- Modern Headphones Arc -->
  <path d="M 140 260 A 116 116 0 0 1 372 260" fill="none" stroke="url(#headsetGrad)" stroke-width="24" stroke-linecap="round" filter="url(#softShadow)"/>

  <!-- Left Ear Cup -->
  <rect x="116" y="236" width="34" height="68" rx="17" fill="url(#headsetGrad)" filter="url(#softShadow)"/>
  <rect x="136" y="244" width="10" height="52" rx="5" fill="#38bdf8"/>

  <!-- Right Ear Cup -->
  <rect x="362" y="236" width="34" height="68" rx="17" fill="url(#headsetGrad)" filter="url(#softShadow)"/>
  <rect x="366" y="244" width="10" height="52" rx="5" fill="#a855f7"/>

  <!-- Dynamic Simultaneous Translation Sound Waves (Letter "M" silhouette) -->
  <g filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="180" y="240" width="12" height="48" rx="6" fill="url(#waveGrad)"/>
    <!-- Bar 2 -->
    <rect x="206" y="205" width="12" height="118" rx="6" fill="url(#waveGrad)"/>
    <!-- Bar 3 (Center dip for "M") -->
    <rect x="232" y="230" width="12" height="68" rx="6" fill="url(#waveGrad)"/>
    <!-- Bar 4 (Center peak) -->
    <rect x="256" y="190" width="12" height="148" rx="6" fill="#34d399"/>
    <!-- Bar 5 -->
    <rect x="280" y="230" width="12" height="68" rx="6" fill="url(#waveGrad)"/>
    <!-- Bar 6 -->
    <rect x="306" y="205" width="12" height="118" rx="6" fill="url(#waveGrad)"/>
    <!-- Bar 7 -->
    <rect x="332" y="240" width="12" height="48" rx="6" fill="url(#waveGrad)"/>
  </g>

  <!-- Real-time Live Spark / Dot indicator -->
  <circle cx="256" cy="380" r="7" fill="#10b981" filter="url(#glow)"/>
  <circle cx="256" cy="380" r="14" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6"/>
</svg>
