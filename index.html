    <script>
      // Ensure trailing slash on GitHub Pages repository URLs so relative ./assets/ always load
      if (location.hostname.endsWith('github.io') && location.pathname.length > 1 && !location.pathname.endsWith('/') && !location.pathname.includes('.')) {
        location.replace(location.pathname + '/' + location.search + location.hash);
      }
    </script>
